name: Price probe (temporary)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python probe_align.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe_result.json
          git commit -m "Probe: jämförelse mot Yahoo (tillfälligt)" || echo "inget"
          git pull --rebase origin main
          git push
